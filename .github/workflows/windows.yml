name: Windows

# The entire per-repo cost of Windows CI. The Nix install and cache, the
# target-existence guard, the cold-cache refusal, the PE-format gate, the
# artifact hand-off and its round-trip check all live once in
# logos-co/logos-windows-ci.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  windows:
    uses: logos-co/logos-windows-ci/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      targets: default logos-container-subprocess-tests
      # The library is one static archive and its headers; the PEs are the tests.
      min-archives: 1
      # The suite nix/tests-windows.nix declares, one gtest case per process,
      # launching real children on a real Windows runner.
      tests: true
      native-smoke: false
      wine-smoke: false
